<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire Building Manager V1.1</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f3f4f6}header{background:#991b1b;color:white;padding:18px}main{max-width:720px;margin:auto;padding:15px}.card{background:white;padding:16px;border-radius:10px;margin:12px 0}.status{padding:12px;background:#fef3c7;border-radius:8px;white-space:pre-wrap}button,input,textarea{padding:11px;font-size:16px;margin:5px 0}input,textarea{width:100%;box-sizing:border-box}.red{background:#991b1b;color:white;border:0;border-radius:7px}.hide{display:none}.building{border-left:5px solid #991b1b}</style></head><body><header><h2>🔥 Fire Building Manager</h2>Building Database — V1.1</header><main><div id="statusBox" class="status">Starting app...</div><button id="addBtn" class="red">+ ADD BUILDING</button><button id="listBtn">BUILDINGS</button><section id="listScreen"><input id="searchBox" placeholder="Search buildings..."><div id="buildingList"></div></section><section id="addScreen" class="hide"><div class="card"><h2>Add Building</h2><form id="buildingForm"><input id="buildingName" required placeholder="Building name"><input id="buildingAddress" required placeholder="Address"><input id="contactName" placeholder="Site contact"><input id="contactPhone" placeholder="Phone"><textarea id="accessNotes" placeholder="Access notes"></textarea><input id="alarmPanel" placeholder="Alarm panel"><input id="panelLocation" placeholder="Panel location"><textarea id="sprinklerDetails" placeholder="Sprinkler details"></textarea><textarea id="siteNotes" placeholder="Site notes"></textarea><button class="red">SAVE BUILDING</button></form></div></section></main><script>
(function(){"use strict";const U="https://vhetzqvkhkwkbpnqiebd.supabase.co",K="sb_publishable_Qtpr2oSDf3M1fpjs96nw-g_yyxY9AwN";let db,sites=[];const S=document.getElementById("statusBox"),L=document.getElementById("listScreen"),A=document.getElementById("addScreen"),O=document.getElementById("buildingList"),Q=document.getElementById("searchBox"),F=document.getElementById("buildingForm");function status(m,t){S.textContent=m;S.style.background=t==="ok"?"#dcfce7":t==="err"?"#fee2e2":"#fef3c7"}function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function render(){let q=Q.value.toLowerCase(),x=sites.filter(s=>((s.name||"")+" "+(s.address||"")).toLowerCase().includes(q));O.innerHTML=x.map(s=>`<div class="card building"><b>${esc(s.name)}</b><p>${esc(s.address)}</p><small>Contact: ${esc(s.contact_name||"—")}<br>Panel: ${esc(s.alarm_panel||"—")}</small></div>`).join("")||'<div class="card">No buildings found.</div>'}async function load(){try{status("Connecting to Supabase...");let r=await db.from("sites_v2").select("*").order("name");if(r.error)throw r.error;sites=r.data||[];status("✓ Connected to Supabase — "+sites.length+" building(s)","ok");render()}catch(e){status("✕ CONNECTION ERROR\n"+(e.message||e),"err")}}document.getElementById("addBtn").onclick=()=>{L.classList.add("hide");A.classList.remove("hide")};document.getElementById("listBtn").onclick=()=>{A.classList.add("hide");L.classList.remove("hide");load()};Q.oninput=render;F.onsubmit=async e=>{e.preventDefault();try{status("Saving building...");let r={name:buildingName.value.trim(),address:buildingAddress.value.trim(),contact_name:contactName.value.trim(),contact_phone:contactPhone.value.trim(),access_notes:accessNotes.value.trim(),alarm_panel:alarmPanel.value.trim(),panel_location:panelLocation.value.trim(),sprinkler_details:sprinklerDetails.value.trim(),site_notes:siteNotes.value.trim()};let z=await db.from("sites_v2").insert(r);if(z.error)throw z.error;F.reset();A.classList.add("hide");L.classList.remove("hide");await load()}catch(e){status("✕ SAVE ERROR\n"+(e.message||e),"err")}};window.onerror=(m)=>status("✕ JAVASCRIPT ERROR\n"+m,"err");try{if(!window.supabase)throw new Error("Supabase library did not load");db=window.supabase.createClient(U,K);load()}catch(e){status("✕ STARTUP ERROR\n"+(e.message||e),"err")}})();
</script></body></html>
