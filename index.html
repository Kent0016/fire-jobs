<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire Building Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f4f6}header{background:#991b1b;color:#fff;padding:18px}main{max-width:720px;margin:auto;padding:15px}.card{background:#fff;padding:16px;border-radius:12px;margin:12px 0}.building{border-left:5px solid #991b1b}button{padding:12px;border:0;border-radius:8px;font-weight:bold;margin:4px}.primary{background:#991b1b;color:#fff}input,textarea{width:100%;padding:11px;margin:5px 0 12px;font-size:16px}.hidden{display:none}.status{padding:10px;background:#fef3c7;border-radius:8px}</style></head><body><header><h2>🔥 Fire Building Manager</h2>Building Database — V1</header><main><div id="status" class="status">Connecting...</div><button class="primary" onclick="add()">+ ADD BUILDING</button><button onclick="list()">BUILDINGS</button><section id="ls"><input id="search" placeholder="Search buildings..." oninput="render()"><div id="out"></div></section><section id="ad" class="hidden"><div class="card"><h2>Add Building</h2><form id="f"><input id="n" required placeholder="Building name"><input id="a" required placeholder="Address"><input id="c" placeholder="Site contact"><input id="p" placeholder="Contact phone"><textarea id="ac" placeholder="Access notes"></textarea><input id="ap" placeholder="Alarm panel make/model"><input id="pl" placeholder="Panel location"><textarea id="sp" placeholder="Sprinkler details"></textarea><textarea id="no" placeholder="Site notes"></textarea><button class="primary">SAVE BUILDING</button></form></div></section></main><script>
const db=supabase.createClient("https://vhetzqvkhkwkbpnqiebd.supabase.co","sb_publishable_Qtpr2oSDf3M1fpjs96nw-g_yyxY9AwN");let sites=[];
const E=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function add(){ls.classList.add("hidden");ad.classList.remove("hidden")}function list(){ad.classList.add("hidden");ls.classList.remove("hidden");load()}
async function load(){let {data,error}=await db.from("sites_v2").select("*").order("name");if(error){status.textContent="Database error: "+error.message;return}sites=data||[];status.textContent="✓ Connected — "+sites.length+" building(s)";status.style.background="#dcfce7";render()}
function render(){let q=search.value.toLowerCase();let x=sites.filter(s=>(s.name+" "+s.address).toLowerCase().includes(q));out.innerHTML=x.map(s=>`<div class="card building"><h3>${E(s.name)}</h3><p>${E(s.address)}</p><small>Contact: ${E(s.contact_name||"—")}<br>Panel: ${E(s.alarm_panel||"—")}</small></div>`).join("")||'<div class="card">No buildings found.</div>'}
f.onsubmit=async e=>{e.preventDefault();let r={name:n.value.trim(),address:a.value.trim(),contact_name:c.value.trim(),contact_phone:p.value.trim(),access_notes:ac.value.trim(),alarm_panel:ap.value.trim(),panel_location:pl.value.trim(),sprinkler_details:sp.value.trim(),site_notes:no.value.trim()};let {error}=await db.from("sites_v2").insert(r);if(error)return alert(error.message);f.reset();await load();list()};load();
</script></body></html>
