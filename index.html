<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fire Jobs V1</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#b91c1c;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 0;opacity:.9;font-size:13px}
nav{display:flex;gap:8px;padding:12px;background:white;border-bottom:1px solid #ddd;position:sticky;top:72px;z-index:4}
nav button{flex:1;padding:12px;border:0;border-radius:8px;background:#e5e7eb;font-weight:bold}
nav button.active{background:#b91c1c;color:white}
main{max-width:700px;margin:auto;padding:16px}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px #0001}
label{display:block;font-weight:bold;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
textarea{min-height:110px;resize:vertical}
.radio{display:flex;gap:10px}
.radio label{flex:1;margin:0}
.radio input{display:none}
.radio span{display:block;text-align:center;padding:12px;border:1px solid #cbd5e1;border-radius:8px}
.radio input:checked+span{background:#b91c1c;color:white;border-color:#b91c1c}
.submit{width:100%;margin-top:18px;padding:14px;border:0;border-radius:8px;background:#b91c1c;color:white;font-size:17px;font-weight:bold}
.status{padding:10px;border-radius:8px;background:#fef3c7;margin-bottom:12px;font-size:14px}
.job{border-left:5px solid #16a34a}
.job.fail{border-left-color:#dc2626}
.job h3{margin:0 0 5px}
.meta{color:#6b7280;font-size:13px;margin:3px 0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:bold;background:#dcfce7;color:#166534}
.badge.fail{background:#fee2e2;color:#991b1b}
.empty{text-align:center;color:#6b7280;padding:30px}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>🔥 Fire Jobs</h1>
<p>Live inspection records</p>
</header>

<nav>
<button id="newTab" class="active" onclick="showTab('new')">New Job</button>
<button id="liveTab" onclick="showTab('live')">Live Jobs</button>
</nav>

<main>
<section id="newSection">
<div class="card">
<div id="connection" class="status">Connecting to database...</div>
<form id="jobForm">
<label>Building Name</label>
<input id="building_name" required placeholder="e.g. ABC Building">

<label>Building Address</label>
<input id="building_address" required placeholder="Street address">

<label>Technician</label>
<input id="technician" placeholder="Your name">

<label>System Type</label>
<select id="system_type" required>
<option value="">Select system</option>
<option>Fire Alarm</option>
<option>Fire Sprinkler</option>
<option>Other</option>
</select>

<label>Result</label>
<div class="radio">
<label><input type="radio" name="result" value="PASS" required><span>✓ PASS</span></label>
<label><input type="radio" name="result" value="FAIL"><span>✕ FAIL</span></label>
</div>

<label>Comments</label>
<textarea id="comments" placeholder="Enter inspection notes..."></textarea>

<button class="submit" type="submit">SUBMIT JOB</button>
</form>
</div>
</section>

<section id="liveSection" class="hidden">
<div id="liveStatus" class="status">Connecting to realtime updates...</div>
<div id="jobs"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vhetzqvkhkwkbpnqiebd.supabase.co";
const SUPABASE_KEY = "sb_publishable_Qtpr2oSDf3M1fpjs96nw-g_yyxY9AwN";
const realtimeClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

const form = document.getElementById("jobForm");
const jobsEl = document.getElementById("jobs");
const connectionEl = document.getElementById("connection");

function showTab(tab){
  document.getElementById("newSection").classList.toggle("hidden", tab !== "new");
  document.getElementById("liveSection").classList.toggle("hidden", tab !== "live");
  document.getElementById("newTab").classList.toggle("active", tab === "new");
  document.getElementById("liveTab").classList.toggle("active", tab === "live");
  if(tab === "live") loadJobs();
}

async function loadJobs(){
  jobsEl.innerHTML = '<div class="empty">Loading jobs...</div>';
  try{
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/jobs?select=*&order=created_at.desc",
      {headers}
    );
    if(!res.ok) throw new Error(await res.text());
    const jobs = await res.json();
    renderJobs(jobs);
  }catch(e){
    jobsEl.innerHTML = '<div class="card">Could not load jobs.<br>'+e.message+'</div>';
  }
}

function renderJobs(jobs){
  if(!jobs.length){
    jobsEl.innerHTML = '<div class="card empty">No jobs have been entered yet.</div>';
    return;
  }
  jobsEl.innerHTML = jobs.map(j => {
    const fail = j.result === "FAIL";
    const date = new Date(j.created_at).toLocaleString("en-NZ");
    return `<div class="card job ${fail ? "fail" : ""}">
      <h3>${esc(j.building_name)}</h3>
      <div class="meta">${esc(j.building_address)}</div>
      <div class="meta">${esc(j.system_type)} • ${esc(j.technician || "No technician")}</div>
      <p><span class="badge ${fail ? "fail" : ""}">${esc(j.result)}</span></p>
      <div>${esc(j.comments || "No comments")}</div>
      <div class="meta" style="margin-top:10px">${date}</div>
    </div>`;
  }).join("");
}

function esc(v){
  return String(v).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const button = form.querySelector("button");
  button.disabled = true;
  button.textContent = "SAVING...";

  const result = document.querySelector('input[name="result"]:checked')?.value;

  const record = {
    building_name: document.getElementById("building_name").value.trim(),
    building_address: document.getElementById("building_address").value.trim(),
    technician: document.getElementById("technician").value.trim(),
    system_type: document.getElementById("system_type").value,
    result,
    comments: document.getElementById("comments").value.trim()
  };

  try{
    const res = await fetch(SUPABASE_URL + "/rest/v1/jobs", {
      method:"POST",
      headers:{...headers,"Prefer":"return=representation"},
      body:JSON.stringify(record)
    });
    if(!res.ok) throw new Error(await res.text());
    form.reset();
    connectionEl.textContent = "✓ Job saved successfully";
    connectionEl.style.background = "#dcfce7";
    showTab("live");
  }catch(err){
    alert("Could not save job:\n\n" + err.message);
  }finally{
    button.disabled = false;
    button.textContent = "SUBMIT JOB";
  }
});

async function testConnection(){
  try{
    const res = await fetch(SUPABASE_URL + "/rest/v1/jobs?select=id&limit=1", {headers});
    if(!res.ok) throw new Error();
    connectionEl.textContent = "✓ Connected to live database";
    connectionEl.style.background = "#dcfce7";
  }catch(e){
    connectionEl.textContent = "⚠ Database connection failed";
    connectionEl.style.background = "#fee2e2";
  }
}


const liveStatus = document.getElementById("liveStatus");

realtimeClient
  .channel("jobs-live")
  .on(
    "postgres_changes",
    { event: "*", schema: "public", table: "jobs" },
    (payload) => {
      liveStatus.textContent = "● LIVE — new information will appear automatically";
      liveStatus.style.background = "#dcfce7";
      loadJobs();
    }
  )
  .subscribe((status) => {
    if (status === "SUBSCRIBED") {
      liveStatus.textContent = "● LIVE — connected to realtime updates";
      liveStatus.style.background = "#dcfce7";
    } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
      liveStatus.textContent = "⚠ Realtime connection problem — retrying";
      liveStatus.style.background = "#fee2e2";
    }
  });

testConnection();
loadJobs();
</script>
</body>
</html>
