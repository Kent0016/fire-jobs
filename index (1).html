<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire Jobs V3</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{font-family:Arial;margin:0;background:#f3f4f6}header{background:#991b1b;color:white;padding:16px}nav,main{max-width:760px;margin:auto;padding:12px}button,input,select,textarea{padding:11px;font-size:16px;margin:5px 0}input,select,textarea{width:100%;box-sizing:border-box}.card{background:white;padding:15px;border-radius:10px;margin:10px 0}.hide{display:none}.row{display:flex;gap:7px;flex-wrap:wrap}button{border:0;border-radius:7px;font-weight:bold}.red{background:#991b1b;color:white}.building{border-left:5px solid #991b1b}.fail{border-left:5px solid #dc2626}.pass{border-left:5px solid #16a34a}small{color:#666}
</style></head><body><header><h2>🔥 Fire Jobs V3</h2>Building database & inspection history</header><nav class="row"><button onclick="screen('list')">Buildings</button><button onclick="screen('inspect')">New Inspection</button><button onclick="loadJobs();screen('live')">Live Jobs</button></nav><main>
<section id="list"><button class="red" onclick="buildingForm()">+ ADD BUILDING</button><input id="search" placeholder="Search buildings..." oninput="renderBuildings()"><div id="buildings"></div></section>
<section id="form" class="hide"><div class="card"><h2 id="ft">Add Building</h2><form id="bf"><input id="bid" type="hidden"><input id="bn" required placeholder="Building name"><input id="ba" required placeholder="Address"><input id="bc" placeholder="Site contact"><input id="bp" placeholder="Phone"><input id="be" placeholder="Email"><textarea id="access" placeholder="Access notes"></textarea><h3>Fire Alarm</h3><input id="panel" placeholder="Panel make/model"><input id="ploc" placeholder="Panel location"><input id="zones" placeholder="Zones"><input id="testpoint" placeholder="Monthly test point"><label><input id="mon" type="checkbox" style="width:auto"> Monitored</label><h3>Sprinkler</h3><input id="spr" placeholder="System type"><input id="valve" placeholder="Valve location"><label><input id="pump" type="checkbox" style="width:auto"> Pump installed</label><textarea id="notes" placeholder="General notes"></textarea><button class="red">SAVE BUILDING</button></form></div></section>
<section id="profile" class="hide"></section>
<section id="inspect" class="hide"><div class="card"><h2>New Inspection</h2><form id="jf"><select id="jb" required></select><input id="tech" placeholder="Technician"><select id="sys" required><option value="">System type</option><option>Fire Alarm</option><option>Fire Sprinkler</option><option>Other</option></select><select id="res" required><option value="">Result</option><option>PASS</option><option>FAIL</option></select><textarea id="com" placeholder="Comments"></textarea><button class="red">SUBMIT INSPECTION</button></form></div></section>
<section id="live" class="hide"><div class="card" id="status">Connecting realtime...</div><div id="jobs"></div></section>
</main><script>
const url="https://vhetzqvkhkwkbpnqiebd.supabase.co",key="sb_publishable_Qtpr2oSDf3M1fpjs96nw-g_yyxY9AwN",db=supabase.createClient(url,key);let bs=[];
function screen(x){["list","form","profile","inspect","live"].forEach(i=>document.getElementById(i).classList.toggle("hide",i!=x))}
function e(x){return String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function loadB(){let {data,error}=await db.from("buildings").select("*").order("building_name");if(error)return alert(error.message);bs=data||[];renderBuildings();jb.innerHTML='<option value="">Select building</option>'+bs.map(b=>`<option value="${b.id}">${e(b.building_name)} — ${e(b.address)}</option>`).join("")}
function renderBuildings(){let q=search.value.toLowerCase(),x=bs.filter(b=>(b.building_name+" "+b.address).toLowerCase().includes(q));buildings.innerHTML=x.map(b=>`<div class="card building" onclick="profileB(${b.id})"><b>${e(b.building_name)}</b><br>${e(b.address)}<br><small>${e(b.alarm_panel||"No panel details")}</small></div>`).join("")||'<div class="card">No buildings found</div>'}
function buildingForm(id){bf.reset();bid.value="";ft.textContent=id?"Edit Building":"Add Building";if(id){let b=bs.find(x=>x.id==id);bid.value=b.id;bn.value=b.building_name;ba.value=b.address;bc.value=b.site_contact||"";bp.value=b.contact_phone||"";be.value=b.contact_email||"";access.value=b.access_notes||"";panel.value=b.alarm_panel||"";ploc.value=b.alarm_panel_location||"";zones.value=b.alarm_zones||"";testpoint.value=b.monthly_test_point||"";mon.checked=!!b.alarm_monitoring;spr.value=b.sprinkler_system||"";valve.value=b.sprinkler_valve_location||"";pump.checked=!!b.sprinkler_pump;notes.value=b.general_notes||""}screen("form")}
bf.onsubmit=async ev=>{ev.preventDefault();let r={building_name:bn.value,address:ba.value,site_contact:bc.value,contact_phone:bp.value,contact_email:be.value,access_notes:access.value,alarm_panel:panel.value,alarm_panel_location:ploc.value,alarm_zones:zones.value,monthly_test_point:testpoint.value,alarm_monitoring:mon.checked,sprinkler_system:spr.value,sprinkler_valve_location:valve.value,sprinkler_pump:pump.checked,general_notes:notes.value};let z=bid.value?await db.from("buildings").update(r).eq("id",bid.value):await db.from("buildings").insert(r);if(z.error)return alert(z.error.message);await loadB();screen("list")}
function card(j){return `<div class="card ${j.result=="FAIL"?"fail":"pass"}"><b>${e(j.system_type)} — ${e(j.result)}</b><p>${e(j.comments||"No comments")}</p><small>${e(j.technician||"")} • ${new Date(j.created_at).toLocaleString("en-NZ")}</small></div>`}
async function profileB(id){let b=bs.find(x=>x.id==id),{data}=await db.from("jobs").select("*").eq("building_id",id).order("created_at",{ascending:false});profile.innerHTML=`<div class="card"><h2>🏢 ${e(b.building_name)}</h2><p>${e(b.address)}</p><button class="red" onclick="newFor(${id})">+ NEW INSPECTION</button> <button onclick="buildingForm(${id})">EDIT</button><h3>Building</h3><p>Contact: ${e(b.site_contact||"—")}<br>Phone: ${e(b.contact_phone||"—")}<br>Email: ${e(b.contact_email||"—")}<br>Access: ${e(b.access_notes||"—")}</p><h3>Fire Alarm</h3><p>Panel: ${e(b.alarm_panel||"—")}<br>Location: ${e(b.alarm_panel_location||"—")}<br>Zones: ${e(b.alarm_zones||"—")}<br>Monitoring: ${b.alarm_monitoring?"Yes":"No"}<br>Test point: ${e(b.monthly_test_point||"—")}</p><h3>Sprinkler</h3><p>System: ${e(b.sprinkler_system||"—")}<br>Valve: ${e(b.sprinkler_valve_location||"—")}<br>Pump: ${b.sprinkler_pump?"Yes":"No"}</p><h3>Notes</h3><p>${e(b.general_notes||"—")}</p></div><h3>Inspection History</h3>${(data||[]).map(card).join("")||'<div class="card">No inspections yet</div>'}`;screen("profile")}
function newFor(id){screen("inspect");jb.value=id}
jf.onsubmit=async ev=>{ev.preventDefault();let b=bs.find(x=>x.id==jb.value),r={building_id:+jb.value,building_name:b.building_name,building_address:b.address,technician:tech.value,system_type:sys.value,result:res.value,comments:com.value};let {error}=await db.from("jobs").insert(r);if(error)return alert(error.message);jf.reset();await profileB(b.id)}
async function loadJobs(){let {data}=await db.from("jobs").select("*").order("created_at",{ascending:false}).limit(100);jobs.innerHTML=(data||[]).map(card).join("")}
db.channel("v3").on("postgres_changes",{event:"*",schema:"public",table:"jobs"},loadJobs).on("postgres_changes",{event:"*",schema:"public",table:"buildings"},loadB).subscribe(s=>{if(s=="SUBSCRIBED")status.textContent="● LIVE — realtime connected"});loadB();loadJobs();
</script></body></html>
